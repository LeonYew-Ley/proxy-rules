[custom]
;==============================================================================
; leon.ini — subconverter 外部配置（tindy2013/subconverter，Clash 目标）
; 公共仓库：只放分流规则与分组，不含任何订阅链接 / token / 私有域名。
; 私有规则在服务器本地 myrules/private.list（见 README）。
;
; 机场归属靠 profile 里 url=tag:EX,... 给每个订阅打 tag，再用下面的 rename 给节点名加前缀：
;   EX· = Edge-X（主力）  PQ· = 赔钱  SM· = 三毛  LX· = 良心云
; 这样 Clash 分组用 !!GROUP=tag 过滤，Shadowrocket 分组用 policy-regex-filter=^EX· 过滤，口径一致。
;==============================================================================

;---------------------------- 规则（自上而下匹配）-----------------------------
; 1. 私有直连（服务器本地文件，不在仓库里）
ruleset=DIRECT,myrules/private.list
; 2. 公共直连 / Tailscale
ruleset=DIRECT,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/direct.list
ruleset=DIRECT,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/tailscale.list
; 3. 按用途分流
ruleset=🔰 节点选择,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/steam.list
ruleset=视频出口,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/video.list
ruleset=下载专用,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/download.list
ruleset=主力故障转移,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/work.list
ruleset=AI自动选择,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/ai.list
; 4. 广告拦截（Johnshall 上游，自动更新）
ruleset=REJECT,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/ads.list
; 5. 上游手工代理列表（Telegram 等）
ruleset=🔰 节点选择,https://raw.githubusercontent.com/LeonYew-Ley/proxy-rules/main/rules/jsh-proxy.list
; 6. 国内 IP 直连，其余走兜底
ruleset=DIRECT,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

enable_rule_generator=true
overwrite_original_rules=true

;---------------------------- 节点命名 ----------------------------------------
rename=!!GROUP=EX!!^(.*)$@EX·$1
rename=!!GROUP=PQ!!^(.*)$@PQ·$1
rename=!!GROUP=SM!!^(.*)$@SM·$1
rename=!!GROUP=LX!!^(.*)$@LX·$1

;---------------------------- 策略组 ------------------------------------------
; 测速 URL：日常 learn.microsoft.com/favicon.ico（要求真的能 200），AI 用 gstatic 204
; 总入口
custom_proxy_group=🔰 节点选择`select`[]主力故障转移`[]赔钱备用`[]三毛备用`[]良心云`[]♻️ 自动选择`[]DIRECT`.*
; 兜底（FINAL）
custom_proxy_group=🐟 漏网之鱼`select`[]🔰 节点选择`[]主力故障转移`[]DIRECT
; Edge-X 自动测速，剔除台湾（台湾留给 AI）
custom_proxy_group=♻️ 自动选择`url-test`!!GROUP=EX!!^(?!.*(台湾|台灣|🇹🇼))`https://learn.microsoft.com/favicon.ico`300,5,100
; 主力故障转移：Edge-X 自动 → 赔钱 → 三毛
custom_proxy_group=主力故障转移`fallback`[]♻️ 自动选择`[]赔钱备用`[]三毛备用`https://learn.microsoft.com/favicon.ico`300,5
; AI：Edge-X 台湾（按订阅顺序，首个可用）→ 日本 → 赔钱 → 三毛
custom_proxy_group=AI自动选择`fallback`!!GROUP=EX!!台湾|台灣|🇹🇼`!!GROUP=EX!!日本|🇯🇵`[]赔钱备用`[]三毛备用`https://www.gstatic.com/generate_204`300,5
; 视频：低价倍率节点（0.01 / 0.1 倍）；没有这类节点时落到 REJECT，不会偷偷走别的出口
custom_proxy_group=视频低价自动`url-test`!!GROUP=PQ!!0\.(01|1)倍`[]REJECT`https://www.gstatic.com/generate_204`300,5,100
custom_proxy_group=视频出口`select`[]视频低价自动`[]主力故障转移`[]REJECT
; 下载专用：三毛 → 赔钱
custom_proxy_group=下载专用`fallback`[]三毛备用`[]赔钱备用`https://learn.microsoft.com/favicon.ico`600,8
; 备用机场（只用 1 倍节点：去掉 0.01/0.1 倍、2x、2~9 倍、IPv6 / 勿跑）
custom_proxy_group=赔钱备用`url-test`!!GROUP=PQ!!^(?!.*(0\.(01|1)倍|2x|[2-9]倍|IPv6))`https://learn.microsoft.com/favicon.ico`300,5,100
custom_proxy_group=三毛备用`url-test`!!GROUP=SM!!^(?!.*(2x|[2-9]倍|勿跑|IPv6))`https://learn.microsoft.com/favicon.ico`300,5,100
custom_proxy_group=良心云`url-test`!!GROUP=LX!!.*`https://learn.microsoft.com/favicon.ico`300,5,100
