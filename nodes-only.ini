[custom]
;==============================================================================
; nodes-only.ini — 只出节点（给 Shadowrocket 订阅用）：不带规则、不带策略组。
; 节点命名与 leon.ini 完全一致（EX· / PQ· / SM· / LX· 前缀），
; 这样 leon.conf 里 policy-regex-filter=^EX· 之类的分组才能匹配。
;==============================================================================
enable_rule_generator=false
rename=!!GROUP=EX!!^(.*)$@EX·$1
rename=!!GROUP=PQ!!^(.*)$@PQ·$1
rename=!!GROUP=SM!!^(.*)$@SM·$1
rename=!!GROUP=LX!!^(.*)$@LX·$1
