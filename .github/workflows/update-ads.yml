name: update-ads
# 每天从 Johnshall/Shadowrocket-ADBlock-Rules-Forever 重新拆出 ads.list / jsh-proxy.list
on:
  schedule:
    - cron: '17 0 * * *'   # 每天 00:17 UTC（上游约 23:00 UTC 构建完）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild lists
        run: ./scripts/update-jsh.sh
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain rules/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rules/ads.list rules/jsh-proxy.list
            git commit -m "chore: update ads.list / jsh-proxy.list from upstream"
            git push
          fi
